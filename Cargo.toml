[package]
name = "faston"
version = "0.4.0"
edition = "2021"
description = "Faston: a Python-like language with braces and semicolons, compiled to native code with Cranelift (or interpreted)"

[[bin]]
name = "faston"
path = "src/main.rs"

[features]
default = ["gui", "jit"]
# The `gui` module (windows, widgets, a drawing canvas).
gui = ["dep:eframe", "dep:image", "dep:winit"]
# The native code generator (Cranelift): `faston run --native` and `faston build`.
# Without it you get a runtime for built programs (faston-rt): it runs the
# machine code `faston build` saved in them, and interprets everything else.
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dependencies]
cranelift-codegen = { version = "0.137.0", optional = true }
cranelift-frontend = { version = "0.137.0", optional = true }
cranelift-jit = { version = "0.137.0", optional = true }
cranelift-module = { version = "0.137.0", optional = true }
cranelift-native = { version = "0.137.0", optional = true }
mimalloc = "0.1.52"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# The GUI stack is large and not on Faston's hot paths: optimize it for size.
[profile.release.package.eframe]
opt-level = "s"
[profile.release.package.egui]
opt-level = "s"
[profile.release.package.epaint]
opt-level = "s"
[profile.release.package.emath]
opt-level = "s"
[profile.release.package.ecolor]
opt-level = "s"
[profile.release.package.egui-winit]
opt-level = "s"
[profile.release.package.egui_glow]
opt-level = "s"
[profile.release.package.glow]
opt-level = "s"
[profile.release.package.glutin]
opt-level = "s"
[profile.release.package.winit]
opt-level = "s"
[profile.release.package.accesskit]
opt-level = "s"
[profile.release.package.accesskit_windows]
opt-level = "s"
[profile.release.package.accesskit_winit]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.ab_glyph]
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true
