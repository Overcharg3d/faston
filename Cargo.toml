[package]
name = "faston"
version = "0.4.0"
edition = "2021"
description = "Faston: a Python-like language with braces and semicolons, compiled to native code with Cranelift (or interpreted)"

[[bin]]
name = "faston"
path = "src/main.rs"

[features]
default = ["gui"]
# The `gui` module (windows, widgets, a drawing canvas). Build with
# --no-default-features for a smaller faston without it.
gui = ["dep:eframe", "dep:image", "dep:winit"]

[dependencies]
cranelift-codegen = "0.137.0"
cranelift-frontend = "0.137.0"
cranelift-jit = "0.137.0"
cranelift-module = "0.137.0"
cranelift-native = "0.137.0"
mimalloc = "0.1.52"
eframe = { version = "0.37", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.profiling]
inherits = "release"
debug = true
